<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BS Cabinet 3D</title>
<style>
:root { --ink: #1f2a33; --mute: #6b7782; --acc: #1f3c78; --panel: rgba(255,255,255,.92); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Sukhumvit Set", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif; color: var(--ink); background: #e9edf1; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.top { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
.title { background: var(--panel); padding: 8px 14px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); pointer-events: auto; }
.title { display: flex; align-items: center; flex-wrap: wrap; } .title img { height: 26px; max-width: 110px; object-fit: contain; margin-right: 9px; }
.inst .ilogo { height: 40px; max-width: 150px; object-fit: contain; margin-right: 4px; }
.title b { font-size: 15px; } .title span { color: var(--mute); font-size: 12px; margin-left: 6px; }
.sp { flex: 1; }
.btns { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 10px; border: 1px solid #ccd3d9; background: var(--panel); cursor: pointer; color: var(--ink); }
button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.card { max-height: 48vh; overflow: auto;  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--panel); border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.15); min-width: 240px; max-width: calc(100vw - 24px); display: none; }
.card .code { display: inline-block; background: var(--acc); color: #fff; border-radius: 8px; padding: 2px 10px; font-weight: 700; margin-right: 8px; }
.card .nm { font-weight: 700; font-size: 16px; }
.card .dim { color: var(--mute); margin-top: 4px; font-size: 13px; }
.card table.info { margin-top: 8px; border-collapse: collapse; font-size: 13px; width: 100%; }
.card table.info th { text-align: left; color: var(--mute); font-weight: 400; padding: 3px 10px 3px 0; vertical-align: top; white-space: nowrap; }
.card table.info td { padding: 3px 0; line-height: 1.4; }
.list { position: fixed; right: 12px; top: 64px; bottom: 90px; width: 230px; background: var(--panel); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08); overflow: auto; padding: 6px; display: none; }
.list.show { display: block; }
.list div { padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.list div:hover, .list div.on { background: #dcecf2; }
.list i { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); }
.list b { min-width: 34px; }
.explode { position: fixed; left: 12px; bottom: 16px; background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.explode input { width: 120px; }
.hint { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: rgba(31,42,51,.8); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; pointer-events: none; transition: opacity .6s; }
.card .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; } .card .acts button { flex: 1; min-width: 120px; font-weight: 600; }
.card .acts button.pri { background: var(--acc); color: #fff; border-color: var(--acc); }
.flat { position: fixed; inset: 0; background: rgba(233,237,241,.97); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.flat.show { display: flex; } .flat h3 { margin: 0 0 4px; font-size: 16px; } .flat .sub { color: var(--mute); font-size: 13px; margin-bottom: 10px; text-align: center; }
.flat svg { width: min(92vw, 900px); height: auto; max-height: 62vh; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.1); }
.flat .close { margin-top: 12px; }
#lead { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
#lead line { stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .9; } #lead circle { stroke-width: 1.6; }
#leadL { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5; }
.ltag { position: absolute; left: 0; top: 0; background: #fff; border: 1.5px solid #c2410c; border-radius: 9px; padding: 4px 9px; font-size: 12px; line-height: 1.35; max-width: 46vw; box-shadow: 0 3px 12px rgba(0,0,0,.14); }
.ltag b { display: block; color: #c2410c; } .ltag span { color: var(--ink); white-space: nowrap; }
.ltag.c1 { border-color: #1f3c78; } .ltag.c1 b { color: #1f3c78; } .ltag.c2 { border-color: #0f766e; } .ltag.c2 b { color: #0f766e; } .ltag.c3 { border-color: #7e22ce; } .ltag.c3 b { color: #7e22ce; }
.inst { position: fixed; inset: 0; background: #eef1f4; display: none; overflow: auto; padding: 12px 14px 40px; z-index: 30; -webkit-overflow-scrolling: touch; }
.inst.show { display: block; }
.inst .ihead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: -12px; background: #eef1f4; padding: 10px 0 8px; z-index: 2; }
.inst h3 { margin: 0; font-size: 17px; } .inst .sub { color: var(--mute); font-size: 12.5px; margin-top: 2px; } .inst h4 { margin: 16px 0 6px; font-size: 14px; }
.inst select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1px solid #ccd3d9; }
.inst .iviews { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 6px; }
.inst figure { margin: 0; background: #fff; border-radius: 12px; padding: 8px 8px 4px; box-shadow: 0 3px 14px rgba(0,0,0,.07); }
.inst figcaption { font-size: 13px; font-weight: 700; margin: 2px 4px 4px; } .inst figure svg { width: 100%; height: auto; max-height: 78vh; display: block; }
.inst table { border-collapse: collapse; width: 100%; max-width: 760px; background: #fff; border-radius: 10px; overflow: hidden; font-size: 13px; }
.inst th, .inst td { padding: 6px 10px; border-bottom: 1px solid #e6eaee; text-align: left; } .inst th { background: #dfe6ec; font-weight: 600; } .inst tr.hi td { background: #ffe9d3; }
.inst .inote { font-size: 12.5px; color: var(--mute); margin-top: 8px; } .inst .inote i { display: inline-block; width: 12px; height: 12px; border: 1px solid transparent; vertical-align: -1px; margin-right: 3px; }
@media print { body > *:not(.inst) { display: none !important; } html, body { overflow: visible; height: auto; background: #fff; } .inst.show { position: static; display: block; background: #fff; padding: 0; overflow: visible; } .inst .ihead { position: static; background: #fff; } .inst button, .inst select { display: none; } .inst figure { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; } }
.empty { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); text-align: center; padding: 30px; }
@media (max-width: 640px) {
.top { flex-wrap: wrap; left: 8px; right: 8px; top: 8px; gap: 6px; }
.title { width: 100%; padding: 6px 12px; } .sp { display: none; }
.btns { width: 100%; justify-content: flex-start; } .btns button { padding: 6px 9px; font-size: 12px; }
.list { left: 8px; right: 8px; width: auto; top: 96px; bottom: auto; max-height: 45vh; }
.explode { left: 8px; bottom: 8px; } .explode input { width: 90px; }
.card { bottom: 56px; min-width: 0; width: calc(100vw - 16px); }
.hint { top: 142px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
<div class="title"><img id="logo" alt="" style="display:none"><b id="ttl">BS Cabinet</b><span id="sub"></span></div>
<span class="sp"></span>
<div class="btns">
<button id="bInst">แบบติดตั้ง</button>
<button id="bFit" class="on" style="display:none">รูฟิตติ้ง</button>
<button id="bList">รายการแผ่น</button>
<button id="bXray">X-ray</button>
<button id="bSpin">หมุนอัตโนมัติ</button>
<button id="bReset">มุมเริ่มต้น</button>
</div>
</div>
<div class="list" id="list"></div>
<div class="explode">แยกชิ้น <input type="range" id="ex" min="0" max="100" value="0"></div>
<div class="card" id="card"></div>
<div class="flat" id="flat"></div>
<svg id="lead"></svg><div id="leadL"></div>
<div class="inst" id="inst"></div>
<div class="hint" id="hint">ลากเพื่อหมุน · สองนิ้ว/ล้อเมาส์ = ซูม · แตะแผ่นเพื่อดูรายละเอียด</div>
